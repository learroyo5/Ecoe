x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: ecoe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecoe
      POSTGRES_USER: ecoe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (raiz del repo)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoe -d ecoe"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging: *default-logging

  db-backup:
    image: postgres:16-alpine
    container_name: ecoe-db-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (raiz del repo)}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
      # Sólo lectura: el respaldo diario incluye los archivos subidos.
      - backend_storage:/storage:ro
    # Respaldo diario (base + archivos, rotación 14 días) y, mientras haya un
    # ECOE en ejecución, un volcado cada 5 minutos en backups/live/.
    # Restauración: scripts/restore_db.sh · ensayo: scripts/verify_backup.sh
    entrypoint: ["/bin/sh", "/backup_loop.sh"]
    mem_limit: 256m
    logging: *default-logging

  backend:
    build:
      context: ./backend
    container_name: ecoe-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # ENVIRONMENT se define en backend/.env (production en el servidor real).
    # No agregarlo aqui: environment: tiene precedencia sobre env_file:.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ecoe:${POSTGRES_PASSWORD}@db:5432/ecoe}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000,https://ecoe.drnotus.cl}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        INTERNAL_API_URL: http://backend:8000
        # Opcional: fija la URL del WebSocket del panel en vivo para
        # topologias distintas a "docker-compose directo" (backend:8000) o
        # "produccion detras de nginx" (mismo origen, ver lib/ws.ts).
        # NEXT_PUBLIC_WS_URL: wss://mi-dominio.cl/api
    container_name: ecoe-frontend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    logging: *default-logging

volumes:
  postgres_data:
  backend_storage:
