server {
    listen 80;
    listen [::]:80;
    server_name plataformaecoe.cl www.plataformaecoe.cl;
    return 301 https://ecoe.cl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plataformaecoe.cl www.plataformaecoe.cl;

    ssl_certificate /etc/letsencrypt/live/plataformaecoe.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataformaecoe.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ecoe.cl$request_uri;
}
